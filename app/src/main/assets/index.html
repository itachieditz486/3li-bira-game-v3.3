<canvas id="c" width="800" height="400"></canvas>
<div id="pad"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><div><div class="col"><button data-k="dash" id="dashBtn">»</button><button data-k="heal">✚</button></div><button data-k="throw" id="thr" class="mid">🥫</button><button data-k="atk" class="big">⚔</button><button data-k="jump" class="big">▲</button></div></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const W=800,H=400,LEVEL=4300,GY=340;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px'}addEventListener('resize',fit);fit();
const padEl=document.getElementById('pad');padEl.style.display='flex';
addEventListener('contextmenu',e=>e.preventDefault());
const keys={left:0,right:0,jump:0,atk:0,dash:0,heal:0,throw:0};
const map={g:'throw',G:'throw',Shift:'dash',c:'dash',C:'dash',h:'heal',H:'heal',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',' ':'jump',w:'jump',W:'jump',x:'atk',X:'atk',j:'atk',J:'atk'};
addEventListener('keydown',e=>{if(state==='talk'){talkKey(e);return}if(map[e.key]){keys[map[e.key]]=1;if(map[e.key]==='atk')atkQ=10;e.preventDefault();if(state!=='play')startIfIdle()}});
addEventListener('keydown',e=>{initAudio();if(e.key==='m'||e.key==='M')mute=!mute;if(state==='title'&&(e.key==='n'||e.key==='N')){cp=null;try{localStorage.removeItem('3lb');newGameTalk()}catch(x){}startIfIdle()}if(state==='up'&&'123'.includes(e.key))pick(+e.key-1)});
addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=0});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();if(state==='talk'){initAudio();talkAdvance();return}try{b.setPointerCapture(e.pointerId)}catch(x){}keys[k]=1;b.classList.add('on');if(k==='atk')atkQ=10;initAudio();if(state!=='play')startIfIdle()},off=e=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));
});
cv.addEventListener('pointerdown',e=>{if(state==='talk'){talkPtr(e);return}if(state==='title'&&cp){const r0=cv.getBoundingClientRect();if((e.clientX-r0.left)/r0.width>.5){cp=null;try{localStorage.removeItem('3lb');newGameTalk()}catch(x){}}}if(state==='up'){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;opts.forEach((o,i)=>{if(px>40+i*250&&px<260+i*250&&py>130&&py<300)pick(i)});return}if(state!=='play')startIfIdle()});

const plats=[[2960,255,130,14],[3190,205,110,14],[3720,205,110,14],[3830,255,130,14],[0,GY,700,60],[820,GY,600,60],[1540,GY,560,60],[2220,GY,2040,60],
 [380,260,120,14],[960,255,140,14],[1180,190,110,14],[1650,260,130,14],[1830,195,120,14],[2380,250,140,14],[2600,185,110,14]];
const heartsDef=[[420,225],[1000,220],[1220,155],[1690,225],[1870,160],[2420,215],[2640,150],[1450,300],[760,300],[2150,300]];
let hero,mons,hearts,state='title',cam=0,lives,score,shake=0,t=0,msg='',girlFree=false,boss;
let AC,mute=0,shots=[];
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}

function drawCanImg(cx,cy,w,hh,rot){g.save();g.imageSmoothingEnabled=true;g.translate(cx,cy);g.rotate(rot);if(canImg.complete&&canImg.naturalWidth)g.drawImage(canImg,-w/2,-hh/2,w,hh);else R(-w/2,-hh/2,w,hh,'#c0182d');g.restore()}
function hitMon(m,n){if(m.sum){if(m.dgd>0)return;if(m.guard>0){if(!(m.gcd>0)){m.gcd=10;m.gblk=1;snd(1100,500,.1,.14,'square');for(let i=0;i<7;i++)pt.push({k:'sh',x:m.x+m.w/2+m.f*30,y:GY-m.dh*.55+(Math.random()-.5)*40,vx:(Math.random()-.5)*3,vy:(Math.random()-.8)*2.4,g:.12,l:18+(Math.random()*12|0),s:2,c:i%2?'#e8f6ff':'#6ab0ff'})}return}}m.hp-=n;m.flash=18;score+=m.big?500:100;shake=m.big?8:3;snd(m.big?120:220,50,.18,.2,'square');if(m.kind&&m.hp>0){const f2=m.hp/m.max,np=m.kind>=2?(f2>.7?0:f2>.35?1:2):Math.min(m.np-1,Math.floor((1-m.hp/m.max)*m.np));if(np>m.ph){m.ph=np;m.flash=40;shake=22;m.cd=40;m.act='';m.plan=[];m.ghost=0;m.rec=0;m.vx*=1.35;snd(90,25,.9,.3,'sawtooth');bn={t:170,a:NM[m.kind]+' EVOLVES!',b:UPG[m.kind][np]}}}if(m.hp<=0&&m.big){mons.forEach(q=>{if(!q.big)q.hp=0});if(m.fin){girlFree=true;activateCP(2)}else{pendCP=m.ri;openUp()}};if(m.hp<=0&&!m.big&&m.drop){m.drop=0;canPk.push({x:m.x+m.w/2,y:GY,got:0})}}

function boom(x,y,tgt){
 shake=Math.max(shake,9);snd(110,28,.4,.32,'sawtooth');snd(520,90,.22,.2,'square');ex.push({x,y,t:22});
 for(let i=0;i<12;i++){const a=-Math.PI*(.08+.84*Math.random()),v=2+Math.random()*3.8;pt.push({k:'l',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,g:.24,l:34+(Math.random()*26|0),s:i%4?2:3,c:['#e8aa28','#f6d77a','#fff8e1'][i%3]})}
 mons.forEach(m=>{if(m.hp<=0||m.sleep||m.ghost||m.grow<1)return;const nx=Math.max(m.x,Math.min(x,m.x+m.w)),ny=Math.max(m.y,Math.min(y,m.y+m.h));if(Math.hypot(nx-x,ny-y)>72&&m!==tgt)return;
  const big=m.big||m.kind,d=m===tgt;if(big&&m.flash>0)return;hitMon(m,big?(d?2:1):(d?3:2));if(m.hp>0){m.stun=big?18:90;if(!big)m.x+=Math.sign(m.x+m.w/2-x)*10}})}
function activateCP(i){cpDone[i]=1;cp={v:2,S:{...S},maxL,score,cans,hearts:hearts.map(c=>c.got),canPk:canPk.slice(0,7).map(c=>c.got),dead:mons.slice(0,11).map(m=>m.hp<=0),done:cpDone.slice(),x:CPX[i]-13,i};cpAnim={i,t:140};bn={t:180,a:'CHECKPOINT UNLOCKED',b:'Progress saved'};arp([523,659,784,1047]);try{localStorage.setItem('3lb',JSON.stringify(cp))}catch(e){}}
function loadCP(){reset(true);if(!cp.v){cp.v=2;cp.maxL=cp.maxL>=4?6:5;cp.S=cp.S||{};cp.S.ih=cp.maxL>=6?1:0}Object.assign(S,cp.S);S.dash=1;S.dj=1;maxL=Math.min(6,Math.max(5,cp.maxL|0));lives=maxL;score=cp.score;cans=cp.cans;hearts.forEach((c,i)=>c.got=cp.hearts[i]);canPk.forEach((c,i)=>{if(i<cp.canPk.length)c.got=cp.canPk[i]});cpDone=cp.done.slice();
 mons.slice(0,11).forEach((m,i)=>{if(cp.dead[i]){m.hp=0;m.sleep=1}});rooms.forEach((r,i)=>{if(cp.dead[8+i])r.state=2});girlFree=!!cp.dead[10];
 hero.x=cp.x;hero.y=GY-48;hero.inv=70;cam=Math.max(0,Math.min(LEVEL-W,hero.x-W/2));if(S.dash)document.getElementById('dashBtn').style.display='';bn={t:120,a:'CHECKPOINT',b:'Restarted from last boss'}}

 cpDone.forEach((d,i)=>{if(!d)return;const x=CPX[i],a=cpAnim&&cpAnim.i===i?cpAnim.t:0;g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,GY-30,2,x,GY-30,44);gr.addColorStop(0,'rgba(255,230,120,.55)');gr.addColorStop(1,'rgba(255,200,60,0)');g.fillStyle=gr;g.fillRect(x-44,GY-74,88,88);g.restore();
  R(x-2,GY-52,4,52,'#c9ccd8');g.fillStyle='#ffd166';g.beginPath();g.moveTo(x+2,GY-52);g.lineTo(x+26,GY-44+Math.sin(t*.1)*2);g.lineTo(x+2,GY-34);g.fill();R(x-6,GY-4,12,4,'#8a8fb0');
